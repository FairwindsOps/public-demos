apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: inference-workloads
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
  - name: bottlerocket-aws-k8s-1.35-nvidia-x86_64-v1.62.0-49f1c7d2
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 50Gi
      volumeType: gp3
  - deviceName: /dev/xvdb
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 100Gi
      volumeType: gp3
  kubelet:
    clusterDNS:
    - 10.100.0.10
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  role: catbox-karpenter_nodes
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: catbox
  - name: catbox-node*
  subnetSelectorTerms:
  - tags:
      Name: catbox-private-us-west-2*
  tags:
    aws-apn-id: pc:di8wx2knnnf38kly1cbn9dbx6
  userData: |
    [settings.kernel]
    lockdown = "integrity"
    [settings.host-containers.admin]
    enabled = false
    [settings.host-containers.control]
    enabled = false
