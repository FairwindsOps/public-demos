# Values for nvidia/dcgm-exporter
# https://github.com/NVIDIA/dcgm-exporter/tree/main/deployment

# Tolerate the same taints used by the ollama workload so we land on GPU nodes.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: karpenter
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: node.kubernetes.io/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule

# Only schedule on nodes that actually expose NVIDIA GPUs.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: In
              values: ["true"]

# Expose metrics on the standard port.
service:
  enable: true
  type: ClusterIP
  port: 9400

# Create a ServiceMonitor so kube-prometheus-stack scrapes it automatically.
serviceMonitor:
  enabled: true
  honorLabels: false
  additionalLabels:
    scrape: kai

# Use simple counters that don't require the profiling module
# The default counters need profiling which fails on some setups
arguments:
  - "-f"
  - "/etc/dcgm-exporter/dcp-metrics-included.csv"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  karpenter.sh/do-not-disrupt: "true"
  prometheus.io/scrape: "true"
  prometheus.io/port: "9400"
