modelServers:
  VLLM:
    images:
      # The key is the image name (referenced from resourceProfiles) and the value is the image.
      # The "default" image should always be specified.
      # "default" is used when no imageName is specified or if a specific image is not found.
      default: "vllm/vllm-openai:v0.20.1"
      nvidia-gpu: "vllm/vllm-openai:v0.20.1"

resourceProfiles:
  nvidia-gpu-t4:
    nodeSelector:
      karpenter.k8s.aws/instance-gpu-name: "t4"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: node.kubernetes.io/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

  nvidia-gpu-l4:
    imageName: "nvidia-gpu"
    nodeSelector:
      karpenter.k8s.aws/instance-gpu-name: "l4"
    limits:
      nvidia.com/gpu: "1"
    requests:
      nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: node.kubernetes.io/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

  nvidia-gpu-h100:
    nodeSelector:
      karpenter.k8s.aws/instance-gpu-name: "h100"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: karpenter
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: node.kubernetes.io/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

cacheProfiles:
  efs-dynamic:
    sharedFilesystem:
      storageClassName: "efs-sc"
  efs-static:
    sharedFilesystem:
      persistentVolumeName: "efs-pv"

modelAutoscaling:
  interval: 15s
  timeWindow: 10m

modelServerPods:
  jsonPatches:
    - op: add
      path: /metadata/annotations/karpenter.sh~1do-not-disrupt
      value: "true"

metrics:
  prometheusOperator:
    vLLMPodMonitor:
      # Enable creation of PodMonitor resource that scrapes vLLM metrics endpoint.
      enabled: true
      labels: {}

